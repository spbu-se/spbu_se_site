name: CD to staging

on:
  push:
    branches:
      - "current"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy_environment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify SHA is reachable by the deploy server
        run: |
          SHA="${GITHUB_SHA}"
          git cat-file -e "${SHA}" 2>/dev/null || {
            echo "::error::Commit ${SHA} does not exist — deploy will fail remotely"
            exit 1
          }
          git fetch origin current --depth=1 2>/dev/null || true
          if ! git merge-base --is-ancestor "${SHA}" origin/current 2>/dev/null; then
            echo "::error::Commit ${SHA} is not an ancestor of origin/current"
            exit 1
          fi
          echo "SHA ${SHA:0:10} is valid and reachable"

      - name: Run deploy on staging server
        env:
          AUTHKEY: ${{ secrets.XSEAUTH }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL_STAGING }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          # Pin the exact commit so re-runs deploy the same version.
          SHA="${GITHUB_SHA}"
          curl --fail --silent --show-error \
            -X POST \
            -H "X-SE-Auth: ${AUTHKEY}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${SHA}\"}" \
            "${WEBHOOK_URL}"

      - name: Verify staging is healthy
        env:
          STAGING_URL: ${{ secrets.STAGING_URL || 'https://se.math.spbu.ru/staging/' }}
        run: |
          echo "Polling ${STAGING_URL} for healthy response..."
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}" || echo "000")
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "✅ Staging healthy after ${i}x15s=$((i*15))s (HTTP ${HTTP_CODE})"
              exit 0
            fi
            echo "  attempt $i/12: HTTP ${HTTP_CODE} — waiting 15s..."
            sleep 15
          done
          echo "::error::Staging did not return 200 within 3 minutes. Last HTTP code: ${HTTP_CODE}"
          exit 1
