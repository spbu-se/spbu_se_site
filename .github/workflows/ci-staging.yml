name: CI (staging + auto)

on:
  push:
    branches: [staging, staging-auto-*]
  pull_request:
    branches: [staging, staging-auto-*]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "staging"

      - run: uv sync

      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run mdformat --check docs/ AGENTS.md CLAUDE.md README.md TODO.md .skills/ .opencode/commands/ .claude/ .agents/
      - run: uv run basedpyright src/
      - run: uv run pylint --disable=all --enable=similarities src/ tests/
      - run: uv run vulture src/ --min-confidence 100 --exclude src/migrations,src/thesesImport.py --ignore-names is_created,revision

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "staging"

      - run: uv sync

      - run: uv run pytest
        env:
          PYTHONPATH: src
