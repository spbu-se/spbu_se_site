name: CI (staging + auto)

on:
  push:
    branches: [staging, staging-auto-*]
  pull_request:
    branches: [staging, staging-auto-*]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "staging"

      - run: uv sync

      - run: uv run ruff format --check src/
      - run: uv run ruff check src/
      - run: uv run mdformat --check docs/ AGENTS.md CLAUDE.md README.md TODO.md .skills/ .opencode/commands/ .claude/ .agents/
      - run: uv run basedpyright src/
      - run: uv run pylint --disable=all --enable=similarities src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "staging"

      - run: uv sync

      - run: uv run pytest
        env:
          PYTHONPATH: src
