name: Basic checks

on:
  push:
    branches: [current]
    tags:
      - "v*"
  pull_request:
    branches: [current]
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "current"
      - run: uv sync

      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run mdformat --check docs/ AGENTS.md CLAUDE.md README.md TODO.md .skills/ .opencode/commands/ .claude/ .agents/
      - run: uv run basedpyright src/
      - run: uv run pylint --disable=all --enable=similarities src/ tests/
      - run: uv run vulture src/ --min-confidence 100 --ignore-names is_created

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if committed build outputs drifted
        run: |
          git diff --exit-code -- \
            src/static/assets/css/quick-website.min.css \
            src/static/assets/js/quick-website.min.js || {
              echo "::error::npm run build regenerated committed assets differently than the committed outputs. Rebuild locally (npm run build) and commit the result."
              exit 1
            }

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "current"
      - run: uv sync

      - run: uv run pytest

  e2e-changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'e2e/**'
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'

  e2e:
    runs-on: ubuntu-latest
    needs: e2e-changes
    if: needs.e2e-changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "current"
      - name: Cache Playwright browsers
        uses: actions/cache@v7
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-1.62.0
      - run: uv sync
      - run: uv run playwright install chromium
      - run: uv run pytest e2e -m e2e --no-cov -n 0 --tb=short
