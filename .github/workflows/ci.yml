name: Basic checks

on:
  push:
    branches: [current]
    tags:
      - "v*"
  pull_request:
    branches: [current]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "current"
      - run: uv sync

      - run: uv run ruff format --check src/
      - run: uv run ruff check src/
      - run: uv run mdformat --check docs/ AGENTS.md CLAUDE.md README.md TODO.md .skills/ .opencode/commands/ .claude/ .agents/

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "current"
      - run: uv sync

      - run: uv run pytest
