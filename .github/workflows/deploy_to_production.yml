name: CD to prod

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy_environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy on production server
        env:
          AUTHKEY: ${{ secrets.XSEAUTH }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Pin the exact tag/commit so re-runs deploy the same version.
          TAG="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"
          curl --fail --silent --show-error \
            -X POST \
            -H "X-SE-Auth: ${AUTHKEY}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${TAG}\",\"sha\":\"${SHA}\"}" \
            "${WEBHOOK_URL}"
