name: CD to prod

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "GPG-signed tag to deploy (e.g. v2026.08.14). Strict policy: only signed tags deploy"
        required: true

permissions:
  contents: read

jobs:
  # Strict signing gate: deploy/release only with a GPG-signed tag. Verified via
  # GitHub's git-data API (checks the tag object's signature against the user's
  # uploaded keys). Fails on lightweight or unsigned annotated tags.
  verify-signature:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve deploy tag
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${RELEASE_TAG:-${GITHUB_REF_NAME}}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify tag GPG signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          TAG_SHA="$(gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" --jq .object.sha)" || {
            echo "::error::Tag '${TAG}' not found or not annotated. Deploy/release requires a GPG-signed tag (strict policy)."
            exit 1
          }
          VERIFIED="$(gh api "repos/${{ github.repository }}/git/tags/${TAG_SHA}" --jq .verification.verified)" || {
            echo "::error::Tag '${TAG}' has no tag object to verify (lightweight tag?). Deploy/release requires a GPG-signed tag (strict policy)."
            exit 1
          }
          if [ "$VERIFIED" != "true" ]; then
            echo "::error::Tag '${TAG}' is NOT GPG-verified. Deploy/release only with a signed tag (strict policy)."
            exit 1
          fi
          echo "::notice::Tag '${TAG}' GPG signature verified."

  deploy:
    needs: [verify-signature]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: deploy_environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Run deploy on production server
        env:
          AUTHKEY: ${{ secrets.XSEAUTH }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Pin the exact tag/commit so re-runs deploy the same version.
          TAG="${INPUT_TAG:-${RELEASE_TAG:-${GITHUB_REF_NAME}}}"
          SHA="$(git rev-parse HEAD)"
          curl --fail --silent --show-error \
            -X POST \
            -H "X-SE-Auth: ${AUTHKEY}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${TAG}\",\"sha\":\"${SHA}\"}" \
            "${WEBHOOK_URL}"

      # Post-deploy smoke test (guardrail from the 2026-08-25 15h outage:
      # the deploy "succeeded" while /theses.html & /news.html returned 500
      # because a model↔DB drift went unmigrated and unmonitored). Fails the
      # release if any key route is not 200 after the webhook returns.
      - name: Post-deploy smoke test (key routes return 200)
        env:
          PROD_HOST: "https://se.math.spbu.ru"
        run: |
          for route in "/" "/theses.html" "/news.html" "/login" "/diplomas/" "/logs"; do
            code="$(curl --fail --silent --show-error --max-time 60 \
              -o /dev/null -w "%{http_code}" "${PROD_HOST}${route}")"
            if [ "$code" != "200" ]; then
              echo "::error::Smoke test failed: ${PROD_HOST}${route} returned ${code} (expected 200). Deployment is broken."
              exit 1
            fi
            echo "OK ${route} -> ${code}"
          done

  release-gate:
    runs-on: ubuntu-latest
    outputs:
      has_release_key: ${{ steps.check.outputs.has_release_key }}
    steps:
      - id: check
        run: echo "has_release_key=${{ secrets.OPENCODE_ZEN_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  release:
    needs: release-gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release-gate.outputs.has_release_key == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install opencode
        run: npm install -g opencode-ai
      - name: Determine previous release tag
        shell: bash
        run: |
          prev="$(gh release list --limit 10 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          echo "PREV_TAG=${prev:-v2025.09.09}" >> "$GITHUB_ENV"
      - name: Generate release notes
        run: |
          mkdir -p .tmp
          opencode run --agent build --auto \
            "Read .skills/release-notes/README.md and follow it exactly. Generate notes for tag ${GITHUB_REF_NAME}. Previous release: ${PREV_TAG}."
      - name: Verify release notes were written
        shell: bash
        run: |
          test -s .tmp/release-notes.md || { echo "::error::.tmp/release-notes.md missing or empty"; exit 1; }
          head -5 .tmp/release-notes.md
      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: .tmp/release-notes.md
          name: ${{ github.ref_name }}
