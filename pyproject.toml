[project]
name = "se-site"
version = "0.1.0"
description = "SPbSU System Programming Department website"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "CacheControl==0.14.4",
    "chardet==7.4.3",
    "Flask==2.3.3",
    "Flask-Admin==2.2.0",
    "Flask-APScheduler==1.13.1",
    "Flask-BasicAuth==0.2.0",
    "Flask-Login==0.6.3",
    "Flask-Markdown==0.3",
    "Flask-Migrate==4.1.0",
    "Flask-SimpleMDE==0.3.0",
    "Flask-Whooshee==0.9.1",
    "Flask-WTF==1.3.0",
    "Frozen-Flask==1.0.2",
    "google-auth-oauthlib==1.4.0",
    "Pillow==12.2.0",
    "PyMuPDF==1.27.2.3",
    "pyparsing==3.3.2",
    "python-dateutil>=2",
    "python-editor==1.0.4",
    "textile==4.0.4",
    "zipp==4.1.0",
    "yadisk==3.4.1",
    "pandas~=2.2.0",
    "openpyxl~=3.1.5",
    "transliterate==1.10.2",
    "Whoosh==2.7.4",
]

[dependency-groups]
dev = [
    "ruff",
    "mdformat",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "djlint",
    "bandit",
    "codespell",
    "pytest-xdist>=3.8.0",
    "mypy>=2.1.0",
    "types-flask>=1.1.6",
    "types-werkzeug>=1.0.9",
    "types-jinja2>=2.11.9",
    "types-markupsafe>=1.1.10",
    "types-click>=7.1.8",
    "types-itsdangerous>=1.1.6",
    "types-sqlalchemy>=1.4.53.38",
    "types-python-dateutil>=2.9.0.20260518",
    "types-pillow>=10.2.0.20240822",
    "lxml>=6.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80 -n 2 --durations=10"

[tool.coverage.run]
omit = ["src/thesesImport.py", "src/wsgi.py", "src/extract_text.py", "src/static/files/*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM", "RUF100"]
ignore = ["E501", "UP009"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/*.py" = ["N801"]
"src/static/files/*" = ["SIM115"]
"src/thesesImport.py" = ["SIM115"]

[tool.djlint]
indent = 2
profile = "jinja"
ignore = "H006,H008,H020,H021,H023,H031"

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B311"]

[tool.codespell]
skip = ".git,.venv,node_modules,src/static/assets/libs"
ignore-words-list = "crate,principale,organise,organised,re-use,re-uses,re-using,theses,recomended"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
no_site_packages = true
disable_error_code = ["no-untyped-def", "no-untyped-call"]
files = [
    "src/",
]

exclude = [
    "numpy",
    "src/templates/",
]

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "se_models",
    "flask_se",
    "flask_se_auth",
    "flask_se_admin",
    "flask_se_diplomas",
    "flask_se_internships",
    "flask_se_practice",
    "flask_se_practice_admin",
    "flask_se_practice_config",
    "flask_se_practice_staff",
    "flask_se_practice_table",
    "flask_se_practice_yandex_disk",
    "flask_se_review",
    "flask_se_scholarships",
    "flask_se_summer_schools",
    "flask_se_theses",
    "extract_text",
    "se_forms",
    "se_internship_forms",
    "se_review_forms",
    "se_sendmail",
    "thesesImport",
    "wsgi",
]
ignore_errors = false
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "var-annotated",
    "arg-type",
    "return-value",
    "operator",
    "assignment",
    "attr-defined",
    "union-attr",
    "misc",
    "type-arg",
    "valid-type",
    "call-overload",
    "override",
    "has-type",
    "list-item",
    "dict-item",
    "index",
    "comparison-overlap",
    "no-any-return",
    "name-defined",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src", "tests"]
