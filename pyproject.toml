[project]
name = "se-site"
version = "0.1.0"
description = "SPbSU System Programming Department website"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "CacheControl==0.14.4",
    "chardet==7.4.3",
    "Flask==2.3.3",
    "Flask-Admin==2.2.0",
    "Flask-APScheduler==1.13.1",
    "Flask-BasicAuth==0.2.0",
    "Flask-Login==0.6.3",
    "Flask-Markdown==0.3",
    "Flask-Migrate==4.1.0",
    "Flask-SimpleMDE==0.3.0",
    "Flask-Whooshee==0.9.1",
    "Flask-WTF==1.3.0",
    "Frozen-Flask==1.0.2",
    "google-auth-oauthlib==1.4.0",
    "Pillow==12.2.0",
    "PyMuPDF==1.27.2.3",
    "pyparsing==3.3.2",
    "python-dateutil>=2",
    "python-editor==1.0.4",
    "textile==4.0.4",
    "zipp==4.1.0",
    "yadisk==3.4.1",
    "pandas~=2.2.0",
    "openpyxl~=3.1.5",
    "transliterate==1.10.2",
    "Whoosh==2.7.4",
]

[dependency-groups]
dev = ["ruff", "mdformat", "pre-commit", "pytest", "pytest-cov", "djlint", "bandit", "codespell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.djlint]
indent = 2
profile = "jinja"
ignore = "H006,H008,H020,H021,H023,H031"

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B311"]

[tool.codespell]
skip = ".git,.venv,node_modules,src/static/assets/libs"
ignore-words-list = "crate,principale,organise,organised,re-use,re-uses,re-using,theses,recomended"
