[project]
name = "se-site"
version = "0.1.0"
description = "SPbSU System Programming Department website"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4~=4.15.0",
    "CacheControl==0.14.4",
    "chardet~=7.4.0",
    "Flask~=3.1.0",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.1.0",
    "Flask-WTF==1.3.0",
    "Frozen-Flask==1.0.2",
    "google-auth-oauthlib==1.4.0",
    "apscheduler>=3.11.0",
    "markdown~=3.10.0",
    "Pillow~=12.3.0",
    "PyMuPDF~=1.28.0",
    "pyparsing==3.3.2",
    "python-dateutil>=2",
    "textile==4.0.4",
    "zipp==4.1.0",
    "yadisk==3.4.1",
    "pandas~=3.0.0",
    "openpyxl~=3.1.5",
    "transliterate==1.10.2",
]

[dependency-groups]
dev = [
    "ruff",
    "mdformat",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "djlint",
    "codespell",
    "pytest-xdist>=3.8.0",
    "basedpyright>=1.39.9",
    "lxml>=6.1.1",
    "ftfy>=6.3.1",
    "pylint>=4.0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80 -n auto --durations=10"
filterwarnings = ["ignore::ResourceWarning"]

[tool.coverage.run]
context = "test"
omit = ["src/thesesImport.py", "src/wsgi.py", "src/extract_text.py", "src/static/files/*"]

[tool.pylint.main]
ignore-paths = [".*migrations.*", ".*\\.venv.*", ".*templates.*", ".*static.*"]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 6

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "SIM",
    "RUF100",
    "B",
    "C4",
    "C90",
    "RET",
    "PERF",
    "TRY",
    "ARG",
    "SLF",
    "S",
    "PLC",
    "PLW",
    "RUF",
]
ignore = ["E501", "UP009"]
allowed-confusables = [
    "а",
    "А", # Cyrillic small/capital a → Latin a/A
    "е",
    "Е", # Cyrillic small/capital e → Latin e/E
    "о",
    "О", # Cyrillic small/capital o → Latin o/O
    "с",
    "С", # Cyrillic small/capital s → Latin c/C
    "р",
    "Р", # Cyrillic small/capital er → Latin p/P
    "х",
    "Х", # Cyrillic small/capital kha → Latin x/X
    "в",
    "В", # Cyrillic small/capital ve → Latin b/B
    "н",
    "Н", # Cyrillic small/capital en → Latin h/H
    "к",
    "К", # Cyrillic small/capital ka → Latin k/K
    "м",
    "М", # Cyrillic small/capital em → Latin m/M
    "т",
    "Т", # Cyrillic small/capital te → Latin t/T
    "у",
    "У", # Cyrillic small/capital u → Latin y/Y
    "г", # Cyrillic small ghe → Latin r
    "ѕ",
    "Ѕ", # Cyrillic small/capital dze → Latin s/S
    "і",
    "І", # Cyrillic small/capital Byelorussian-Ukrainian i → Latin i/I
    "ј",
    "Ј", # Cyrillic small/capital je → Latin j/J
    "б", # Cyrillic small be → digit 6
    " ", # NO-BREAK SPACE → SPACE
    "–", # EN DASH → HYPHEN-MINUS
    "‹", # SINGLE LEFT-POINTING ANGLE QUOTATION MARK → LESS-THAN
    "›", # SINGLE RIGHT-POINTING ANGLE QUOTATION MARK → GREATER-THAN
    "‘", # LEFT SINGLE QUOTATION MARK → GRAVE ACCENT
    "’", # RIGHT SINGLE QUOTATION MARK → GRAVE ACCENT
    "‚", # SINGLE LOW-9 QUOTATION MARK → COMMA
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "S101", "ARG"]
"tests/*.py" = ["N801", "PT006", "PT007", "S101", "S108", "S105", "S102", "PLC0415", "ARG"]
"src/flask_se_admin.py" = ["RUF012"]
"src/flask_se_practice.py" = ["C901"]
"src/flask_se_practice_admin.py" = ["C901"]
"src/flask_se_practice_config.py" = ["PLC0415"]
"src/flask_se_theses.py" = ["C901"]
"src/static/files/*" = ["SIM115"]
"src/thesesImport.py" = ["SIM115", "C901"]
"src/se_models.py" = ["C901"]

[tool.djlint]
indent = 2
profile = "jinja"
ignore = "H006,H008,H020,H021,H023,H031"

[tool.codespell]
skip = ".git,.venv,node_modules,src/static/assets/libs"
ignore-words-list = "crate,principale,organise,organised,re-use,re-uses,re-using,theses,recomended"

[tool.basedpyright]
typeCheckingMode = "all"
strictParameterNoneValue = true
enableTypeIgnoreComments = false
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
deprecateTypingAliases = true
reportMissingModuleSource = "warning"
reportMissingImports = "error"
reportUnusedImport = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportConstantRedefinition = "error"
reportMissingTypeStubs = "warning"
