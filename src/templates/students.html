{% extends "base_dark.html" %}
{% block title %}Контакты кафедры{% endblock %}
{% block description %}
  Раздел для студентов кафедры Системного программирования Математико-механического факультета СПбГУ.
{% endblock %}
{% block content %}
  <!-- Main content -->
  <section class="slice py-8 bg-dark bg-cover bg-size--cover"
           style="background-image: url({{ url_for('static', filename='/assets/img/main2.jpg') }})">
    <!-- Container -->
    <div class="container pt-5 pt-lg-7 pb-lg-9 pb-7">
      <div class="row align-items-center justify-content-center">
        <div class="col-lg-8 text-center">
          <h1 class="text-white">Студентам</h1>
          <p class="lead text-white opacity-8">Раздел находится в разработке</p>
        </div>
      </div>
    </div>
    <!-- SVG Separator -->
    <div class="shape-container shape-position-bottom">
      <svg xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 1000 100"
           preserveAspectRatio="none">
        <path d="M 0 0 c 0 0 200 50 500 50 s 500 -50 500 -50 v 101 h -1000 v -100 z"></path>
      </svg>
    </div>
  </section>
{% endblock %}
