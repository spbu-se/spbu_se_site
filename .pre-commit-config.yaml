repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff
        name: ruff (check + fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: mdformat
        name: mdformat
        entry: uv run mdformat docs/ AGENTS.md CLAUDE.md README.md TODO.md .skills/ .opencode/commands/ .claude/ .agents/
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-requirements
        name: Validate requirements.txt format
        entry: uv run pip install --dry-run -r requirements.txt
        language: system
        pass_filenames: false
        files: ^requirements\.txt$

  - repo: https://github.com/trim21/dprint-pre-commit
    rev: v0.55.1.4
    hooks:
      - id: dprint
        args: [fmt]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: ^src/static/assets/libs/
      - id: check-added-large-files
      - id: check-case-conflict
      - id: end-of-file-fixer
        exclude: ^src/static/
      - id: trailing-whitespace
        exclude: ^src/static/

  - repo: https://github.com/Riverside-Healthcare/djlint
    rev: v1.36.4
    hooks:
      - id: djlint
        args: ["--reformat"]
        types: [html]
        exclude: ^src/static/assets/libs/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/|^src/migrations/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--toml", "pyproject.toml"]
        exclude: ^src/static/assets/libs/|\.svg$|\.min\.(css|js)$|uv\.lock$

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
