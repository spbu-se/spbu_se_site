repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff
        name: ruff (check + fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: mdformat
        name: mdformat (changed files only)
        entry: uv run mdformat
        language: system
        types: [markdown]
        stages: [pre-commit]

  - repo: https://github.com/trim21/dprint-pre-commit
    rev: v0.55.1.4
    hooks:
      - id: dprint
        args: [fmt]
        stages: [pre-commit]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: ^src/static/assets/libs/
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^src/static/
        stages: [pre-commit]
      - id: trailing-whitespace
        exclude: ^src/static/
        stages: [pre-commit]

  - repo: https://github.com/Riverside-Healthcare/djlint
    rev: v1.36.4
    hooks:
      - id: djlint
        args: ["--reformat"]
        types: [html]
        exclude: ^src/static/assets/libs/
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        stages: [pre-push]

  # --- Pre-push hooks ---
  - repo: local
    hooks:
      - id: pre-push-uv-lock
        name: "pre-push: uv lock --check"
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pre-push-fast-checks
        name: "pre-push: format + lint + gate (fail-fast)"
        entry: uv run python scripts/pre_push_checks.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pre-push-basedpyright
        name: "pre-push: basedpyright"
        entry: uv run basedpyright src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
