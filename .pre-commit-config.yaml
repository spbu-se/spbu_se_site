repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff
        name: ruff (check + fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: mdformat
        name: mdformat
        entry: uv run mdformat
        language: system
        types: [markdown]

  - repo: https://github.com/trim21/dprint-pre-commit
    rev: v0.55.1.4
    hooks:
      - id: dprint
        args: [fmt]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^src/static/assets/libs/
      - id: trailing-whitespace
        exclude: ^src/static/assets/libs/|\.(svg|min\.(css|js))$
