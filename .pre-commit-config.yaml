repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff
        name: ruff (check + fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: mdformat
        name: mdformat (changed files only)
        entry: uv run mdformat
        language: system
        types: [markdown]
        stages: [pre-commit]

      - id: validate-requirements
        name: Validate requirements.txt format
        entry: uv run python -c "from packaging.requirements import Requirement; [Requirement(l.strip()) for l in open('requirements.txt', encoding='utf-8-sig') if l.strip() and not l.strip().startswith(('#', '-e '))]"
        language: system
        pass_filenames: false
        files: ^requirements\.txt$
        stages: [pre-push]

  - repo: https://github.com/trim21/dprint-pre-commit
    rev: v0.55.1.4
    hooks:
      - id: dprint
        args: [fmt]
        stages: [pre-commit]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: ^src/static/assets/libs/
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^src/static/
        stages: [pre-commit]
      - id: trailing-whitespace
        exclude: ^src/static/
        stages: [pre-commit]

  - repo: https://github.com/Riverside-Healthcare/djlint
    rev: v1.36.4
    hooks:
      - id: djlint
        args: ["--reformat"]
        types: [html]
        exclude: ^src/static/assets/libs/
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        stages: [pre-push]

  # --- Pre-push hooks ---
  - repo: local
    hooks:
      - id: pre-push-uv-lock
        name: "pre-push: uv lock --check"
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pre-push-fast-checks
        name: "pre-push: format + lint (fail-fast)"
        entry: powershell -Command "uv run mdformat --check docs/ AGENTS.md CLAUDE.md README.md TODO.md .skills/ .opencode/commands/ .claude/ .agents/; if ($?) { uv run ruff format --check src/ tests/ }; if ($?) { uv run ruff check src/ tests/ }; if ($?) { uv run pylint --disable=all --enable=similarities src/ tests/ }; if ($?) { uv run vulture src/ --min-confidence 100 --exclude src/thesesImport.py --ignore-names is_created }"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pre-push-basedpyright
        name: "pre-push: basedpyright"
        entry: uv run basedpyright src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: validate-requirements
        name: Validate requirements.txt format
        entry: uv run python -c "from packaging.requirements import Requirement; [Requirement(l.strip()) for l in open('requirements.txt', encoding='utf-8-sig') if l.strip() and not l.strip().startswith(('#', '-e '))]"
        language: system
        pass_filenames: false
        files: ^requirements\.txt$
        stages: [pre-push]
